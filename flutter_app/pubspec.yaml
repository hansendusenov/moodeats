name: moodeats_app
description: "MoodEats Mobile App - Autonomous Hyperlocal Sentiment Commerce"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Backend & Auth
  supabase_flutter: ^2.3.4
  flutter_dotenv: ^5.1.0

  # Network & API
  http: ^1.2.0

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  lucide_icons: ^0.257.0

  # Device & Sensors
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  webview_flutter: ^4.14.1
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
